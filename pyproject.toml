[project]
name = "recomendacoes-api"
version = "0.1.0"
description = "API for searching places and submitting user reviews and activity suggestions"
readme = "README.md"
authors = [
    { name = "timoteostifft", email = "timoteostifft@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
